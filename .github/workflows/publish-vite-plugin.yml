name: Publish vite-plugin-slate

on:
  push:
    tags:
      - "vite-plugin-slate-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing via OIDC (no npm token). Provenance needs a public repo.

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-plugin-slate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#vite-plugin-slate-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag version ($tag) != package.json version ($pkg)" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
